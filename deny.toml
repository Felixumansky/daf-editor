# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Daf is MPL-2.0 and written from scratch; copyleft-incompatible or viral licenses are not allowed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# Daf's own code must never talk to the network (trust pillar). Tauri links an HTTP client
# internally; it is allowed only through Tauri, never as a direct dependency of our crates.
deny = [
  { crate = "reqwest", wrappers = ["tauri"] },
  { crate = "hyper", wrappers = ["reqwest", "hyper-util"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
