name: Feature request
description: Suggest something Daf should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should Daf help?
  - type: input
    id: elsewhere
    attributes:
      label: Does another editor do this well?
      placeholder: e.g. Notepad++, VS Code
