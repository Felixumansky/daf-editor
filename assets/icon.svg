<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Daf ("page"): a sheet with a folded corner. Text lines are right-aligned, a nod to Hebrew. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf0fa"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e2f6"/>
      <stop offset="1" stop-color="#9fb6de"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f86f2"/>
      <stop offset="1" stop-color="#2459d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2a66" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Page with the top-right corner folded. -->
  <path filter="url(#shadow)"
        d="M262 72 H640 L852 284 V896 Q852 952 796 952 H262 Q206 952 206 896 V128 Q206 72 262 72 Z"
        fill="url(#paper)" stroke="#2f6feb" stroke-width="22" stroke-linejoin="round"/>
  <!-- The fold. -->
  <path d="M640 72 V232 Q640 284 692 284 H852 Z"
        fill="url(#fold)" stroke="#2f6feb" stroke-width="22" stroke-linejoin="round"/>

  <!-- Lines of text, flush right. -->
  <g fill="url(#ink)">
    <rect x="330" y="396" width="414" height="58" rx="29"/>
    <rect x="454" y="510" width="290" height="58" rx="29"/>
    <rect x="300" y="624" width="444" height="58" rx="29"/>
    <rect x="514" y="738" width="230" height="58" rx="29"/>
  </g>
</svg>
